# Apache VirtualHost for Nectar Haven (static Vite site).
# Install to: /etc/apache2/sites-available/nectarhaven.conf
#
# This is the PLAIN HTTP (:80) version. Run certbot afterwards
# (see vps-setup.sh) and it will generate the :443 SSL block for you.

<VirtualHost *:80>
    ServerName nectarhavenfeeders.com
    ServerAlias www.nectarhavenfeeders.com
    DocumentRoot /var/www/nectarhavenfeeders.com

    <Directory /var/www/nectarhavenfeeders.com>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # SPA fallback, if you ever add client-side routes.
        # NOTE: this MUST live inside <Directory>, not the <VirtualHost>.
        # In VirtualHost context %{REQUEST_FILENAME} isn't resolved to the
        # real filesystem path, so the -f test wrongly fails for files that
        # DO exist and every request (even /assets/*.js) gets rewritten to
        # index.html — served as text/html, which breaks module scripts.
        #
        # The current site is a single scrolling page with anchor links and
        # needs no fallback, so it's left disabled. To enable, uncomment:
        #   FallbackResource /index.html
        # FallbackResource only triggers on would-be 404s and never
        # intercepts existing files, so it avoids the bug above entirely.
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/nectarhaven_error.log
    CustomLog ${APACHE_LOG_DIR}/nectarhaven_access.log combined
</VirtualHost>
