# Apache VirtualHost for Nectar Haven (static Vite site).
# Install to: /etc/apache2/sites-available/nectarhaven.conf
#
# This is the PLAIN HTTP (:80) version. Run certbot afterwards
# (see vps-setup.sh) and it will generate the :443 SSL block for you.

<VirtualHost *:80>
    ServerName nectarhavenfeeders.com
    ServerAlias www.nectarhavenfeeders.com
    DocumentRoot /var/www/nectarhaven

    <Directory /var/www/nectarhaven>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # SPA fallback: serve index.html for any path that isn't a real
    # file or directory. Harmless for the current single-page layout,
    # and future-proofs client-side routes if you ever add them.
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/nectarhaven_error.log
    CustomLog ${APACHE_LOG_DIR}/nectarhaven_access.log combined
</VirtualHost>
